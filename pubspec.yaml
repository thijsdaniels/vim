name: vim
description: A health tracking app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0"

dependencies:
  cloud_firestore: ^4.3.1
  # firebase_analytics: ^10.1.5
  firebase_auth: ^4.2.5
  collection: ^1.17.0
  firebase_core: ^2.4.1
  # firebase_crashlytics: ^3.0.16
  # firebase_performance: ^0.9.0+15
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.12.0
  flutter_native_splash: ^2.2.18
  # google_sign_in: ^6.0.2
  intl: ^0.18.0
  provider: ^6.0.5
  flutter_shaders: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/google-sans/regular.ttf
  assets:
    - assets/images/icons8/arcade/
    - assets/images/icons8/stickers/
  shaders:
    - assets/shaders/surface_shader.frag

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: assets/images/icon_background.png
  adaptive_icon_foreground: assets/images/icon_foreground.png
  web:
    generate: true
    image_path: assets/images/icon.png
    background_color: "#1C1B1F"
    theme_color: "#7541EA"
  windows:
    generate: true
    image_path: assets/images/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/icon.png

flutter_native_splash:
  background_image: assets/images/icon_background.png
  image: assets/images/icon_foreground.png
